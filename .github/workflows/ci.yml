# CI (BLUEPRINT §21): typecheck → lint → tests (incl. the DATABASE_URL-gated
# integration suites against a real Postgres) → build → audit.
name: CI

on:
  push:
    branches: [main, Develop]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: flow
          POSTGRES_PASSWORD: flow
          POSTGRES_DB: flow
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U flow"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      # Unlocks the auth-rotation, sync-route and stripe-lifecycle integration
      # tests that are skipped without a database.
      DATABASE_URL: postgresql://flow:flow@localhost:5432/flow
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version from package.json "packageManager"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create test database schema
        run: pnpm exec prisma db push --skip-generate
        working-directory: apps/api
      - run: pnpm exec turbo run build typecheck lint test
      - name: Dependency audit (prod, high+)
        run: pnpm audit --prod --audit-level high

  desktop-smoke:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec turbo run build --filter @flow/desktop
      - name: Electron smoke test (boot, renderers, demo dictation)
        run: pnpm exec electron . --smoke
        working-directory: apps/desktop
